<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pensiero Motivazionale</title>

    <!-- Meta tag per anteprima Social (Open Graph & Twitter) -->
    <meta property="og:title" content="Pensiero Motivazionale">
    <meta property="og:description" content="Una frase motivazionale per la tua giornata.">
    <meta property="og:image" content="generatore.jpg">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pensiero Motivazionale">
    <meta name="twitter:description" content="Una frase motivazionale per la tua giornata.">
    <meta name="twitter:image" content="generatore.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="generatore.jpg">

    <!-- Fogli di stile esterni -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #FAF4ED;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .quote-font {
            font-family: 'Cormorant Garamond', serif;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 text-[#28150B]">

    <main class="max-w-xl w-full mx-auto my-auto flex flex-col items-center">
        
        <!-- Immagine di Copertina Adattabile -->
        <div class="w-full max-w-xl mx-auto mb-6 rounded-2xl overflow-hidden shadow-md border border-[#E2CBAD] flex justify-center bg-[#FDFBF7]">
            <img src="generatore.jpg" alt="Copertina" class="w-full h-auto max-h-80 object-contain block">
        </div>

        <!-- Box Frase Motivazionale -->
        <div class="w-full bg-[#FDFBF7] rounded-3xl p-8 sm:p-12 shadow-lg border border-[#E2CBAD]/80 text-center relative mb-8">
            <p id="quoteOutput" class="quote-font italic text-2xl sm:text-4xl font-medium leading-relaxed text-[#28150B]">
                "Caricamento..."
            </p>
        </div>

        <!-- Pulsanti Azione -->
        <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
            <button onclick="generateQuote()" class="flex-1 bg-[#BE4B2A] hover:bg-[#8A5833] text-white font-semibold py-4 px-6 rounded-2xl shadow-md transition-all active:scale-95 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-rotate"></i>
                <span>Nuova Frase</span>
            </button>

            <button onclick="shareQuote()" class="bg-[#F2E5D5] hover:bg-[#E2CBAD] text-[#4A2B18] font-semibold py-4 px-6 rounded-2xl transition-all active:scale-95 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-share-nodes"></i>
                <span>Condividi</span>
            </button>
        </div>

    </main>

    <!-- Toast Notifica Copia -->
    <div id="toast" class="fixed bottom-6 bg-[#28150B] text-white text-xs sm:text-sm px-4 py-3 rounded-xl shadow-xl transition-all duration-300 opacity-0 pointer-events-none">
        Frase copiata negli appunti!
    </div>

    <script>
        const database = {
            A: [
                "Guardi il caffè e capisci che",
                "Prendi l'autobus delle 8 e senti che",
                "Cerchi le chiavi nella giacca e ritrovi",
                "Basta un biscotto inzuppato male per intuire che",
                "La pioggia di martedì ti ricorda che",
                "Guardando la brioche al banco capisci che",
                "In fila alle poste capisci subito che",
                "Sistemandoti la sciarpa realizzi che",
                "Quando vedi l'estratto conto intuisci che",
                "Davanti al frigorifero aperto alle due di notte capisci che",
                "Vedendo la gente correre sotto la pioggia capisci che",
                "Mentre aspetti il verde al semaforo ti accorgi che",
                "Slacciandoti le scarpe la sera capisci che",
                "Guardando il gatto che dorme sul divano ti rendi conto che",
                "Quando ti cade il gelato a terra capisci che",
                "Apri la finestra la mattina e capisci che",
                "Trovando uno scontrino vecchio in tasca scopri che",
                "Quando ti viene la febbre nel weekend capisci che",
                "Mentre aspetti che la moka salga scopri che",
                "Guardando il traffico dalla finestra capisci che"
            ],
            B: [
                "l'unica certezza è che qualcuno ti chiederà dei soldi,",
                "siamo fatti di sogni e di bollette da pagare,",
                "gli abbracci più sinceri non ti costano nulla,",
                "la felicità costa troppo e spesso è pure fuori produzione,",
                "cambiare strada a volte serve solo a perdersi meglio,",
                "le cose belle capitano quando non ti importa più niente,",
                "il destino ti sorride, ma ha un umorismo pessimo,",
                "l'amore è fantastico, finché non bisogna dividere il conto,",
                "imparare a perdonarsi è l'unico modo per tirare avanti,",
                "la vita è un viaggio, ma il biglietto costa un botto,",
                "certi silenzi dicono semplicemente 'lasciami in pace',",
                "i sogni sono belli, ma la sveglia suona comunque,",
                "non puoi piacere a tutti, non sei mica un trancio di pizza,",
                "la speranza è l'ultima a morire, ma la pazienza muore prima,",
                "se continui a guardare indietro finisci per sbattere contro un palo,",
                "se tutto va bene, è solo perché hai visto male,",
                "il tempo aggiusta tutto, tranne il conto in banca,",
                "le cicatrici insegnano, ma il dolore resta una rottura,",
                "bisogna imparare a dire di no, anche solo per fare dispetto,",
                "la calma è la virtù dei forti e di chi non ha capito la situazione,"
            ],
            C: [
                "e allora tanto vale",
                "perché in fondo l'importante è",
                "ed è lì che capisci che bisogna",
                "quindi l'unica soluzione è",
                "e pazienza se tutto va a rotoli: l'essenziale è",
                "proprio come insegnano i saggi: conviene",
                "e allora sorridi e decidi di",
                "perché lamentarsi non serve a niente, meglio",
                "ed è bellisimo capire che basta",
                "quindi fai un bel respiro e prova a",
                "perché alla fine la scelta migliore è",
                "e pazienza per il resto, tu pensa solo a",
                "ed è inutile girarci intorno: dovresti",
                "quindi chiudi gli occhi e prova a",
                "e prima che qualcuno ti rovini la giornata, vai a"
            ],
            D: [
                "mordere la vita prima che ti chieda il conto.",
                "ordinare un altro cornetto e perdonarti di esistere.",
                "farti una risata e tirare dritto.",
                "mandare tutti a quel paese con eleganza.",
                "ricominciare da capo, ma stavolta con più calma.",
                "fare finta di niente e goderti il caffè.",
                "accettare il caos e andare a dormire presto.",
                "spegnere il telefono e fare finta di essere all'estero.",
                "mantenere la calma, tanto peggio di così non può andare.",
                "mangiarti una pizza e non pensarci più.",
                "camminare a testa alta, anche con le scarpe bagnate.",
                "bere un bicchiere d'acqua e lasciar perdere.",
                "sorridere a tutti, giusto per farli innervosire.",
                "abbracciare chi ti sta vicino e regalarti un'ora di sonno.",
                "abbandonare le aspettative e prenderti una brioche."
            ]
        };

        let currentText = "";

        function generateQuote() {
            const a = database.A[Math.floor(Math.random() * database.A.length)];
            const b = database.B[Math.floor(Math.random() * database.B.length)];
            const c = database.C[Math.floor(Math.random() * database.C.length)];
            const d = database.D[Math.floor(Math.random() * database.D.length)];

            currentText = `${a} ${b} ${c} ${d}`;
            document.getElementById('quoteOutput').textContent = `"${currentText}"`;
        }

        function shareQuote() {
            if (navigator.share) {
                navigator.share({
                    title: 'Pensiero Motivazionale',
                    text: `"${currentText}"`
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(`"${currentText}"`).then(() => {
                    showToast();
                });
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        window.onload = generateQuote;
    </script>
</body>
</html>
