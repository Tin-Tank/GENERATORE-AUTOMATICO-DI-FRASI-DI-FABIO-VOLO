<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pensiero Motivazionale</title>

    <!-- Meta tag per anteprima Social (Open Graph & Twitter) -->
    <meta property="og:title" content="Pensiero Motivazionale">
    <meta property="og:description" content="Una frase motivazionale per la tua giornata.">
    <meta property="og:image" content="generatore.jpg">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pensiero Motivazionale">
    <meta name="twitter:description" content="Una frase motivazionale per la tua giornata.">
    <meta name="twitter:image" content="generatore.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="generatore.jpg">

    <!-- Fogli di stile esterni -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #FAF4ED;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .quote-font {
            font-family: 'Cormorant Garamond', serif;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 text-[#28150B]">

    <main class="max-w-xl w-full mx-auto my-auto flex flex-col items-center">
        
        <!-- Box Frase Motivazionale -->
        <div class="w-full bg-[#FDFBF7] rounded-3xl p-8 sm:p-12 shadow-lg border border-[#E2CBAD]/80 text-center relative mb-8">
            <p id="quoteOutput" class="quote-font italic text-2xl sm:text-4xl font-medium leading-relaxed text-[#28150B]">
                "Caricamento..."
            </p>
        </div>

        <!-- Pulsanti Azione -->
        <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
            <button onclick="generateQuote()" class="flex-1 bg-[#BE4B2A] hover:bg-[#8A5833] text-white font-semibold py-4 px-6 rounded-2xl shadow-md transition-all active:scale-95 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-rotate"></i>
                <span>Nuova Frase</span>
            </button>

            <button onclick="shareQuote()" class="bg-[#F2E5D5] hover:bg-[#E2CBAD] text-[#4A2B18] font-semibold py-4 px-6 rounded-2xl transition-all active:scale-95 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-share-nodes"></i>
                <span>Condividi</span>
            </button>
        </div>

    </main>

    <!-- Toast Notifica Copia -->
    <div id="toast" class="fixed bottom-6 bg-[#28150B] text-white text-xs sm:text-sm px-4 py-3 rounded-xl shadow-xl transition-all duration-300 opacity-0 pointer-events-none">
        Frase copiata negli appunti!
    </div>

    <script>
        const database = {
            A: [
                "Certi sabati mattina ti svegli, guardi la tazza del latte e capisci che",
                "Ho visto gente prendere il treno delle 7:15 senza sapere che",
                "A volte l'amore è come quando cerchi le chiavi nella giacca e ritrovi",
                "Non serve andare fino in India; basta un caffè al banco per intuire che",
                "La pioggia sui vetri di un martedì di novembre ti ricorda sempre che",
                "Se impari ad ascoltare il silenzio tra due fermate di metropolitana, scopri che",
                "C'è un momentino preciso, verso il tramonto, in cui ti accorgi che",
                "Mettersi il cappotto prima di uscire è un po' come accettare che",
                "Guardando il vapore della brioche appena sfornata comprendi improvvisamente che",
                "Quando aspetti il verde al semaforo insieme agli sconosciuti, senti che",
                "L'odore del pane fresco la domenica mattina ha il potere di spiegarti che",
                "Certi sguardi incrociati al banco del bar mentre giri il cucchiaino rivelano che",
                "Sistemarsi la sciarpa quando tira vento a Milano è l'ennesima prova che",
                "Ritrovare uno scontrino stropicciato nella tasca dei jeans significa semplicemente che",
                "Aprire il frigorifero alle due di notte senza fame è solo il modo in cui"
            ],
            B: [
                "l'ermeneutica della tua solitudine necessita di un'epoché fenomenologica,",
                "l'ontologia del quotidiano e la surrettizia nozione di impermanenza",
                "l'incommensurabile aporia tra la catarsi emotiva e l'entropia dei ricordi",
                "l'ipostasi del desiderio risente dell'esegesi del non detto,",
                "la dialettica immanente del destino scardina l'idiosincrasia della paura,",
                "la teleologia dei tuoi passi altro non è che un'apocatastasi interiore,",
                "la prosopopea della nostalgia si dissolve nell'alchimia della prassi,",
                "l'analettica del rimpianto si scontra con la palingenesi del cuore,",
                "la decostruzione post-moderna del sentimento soffre di eudaimonia incompiuta,",
                "la tautologia del dolore incontra la tautocronia dell'anima,",
                "il solipsismo affettivo richiede una ricognizione gnoseologica profonda,",
                "l'anamnesi dell'infanzia ridetermina l'incommensurabilità del presente,",
                "la dimensione noematica dell'abbraccio supera l'empirismo del quotidiano,",
                "la sovrastruttura ideologica della colazione nega l'autenticità dell'essere,",
                "l'incongruenza assiologica delle scelte umane rivela l'ipostasi dell'assurdo,"
            ],
            C: [
                "e allora capisci che la vita non è una stazione di testa, ma",
                "ed è lì che la tazzina vuota ti sorride e diventa",
                "perché in fondo siamo tutti come quei libri lasciati sul comodino:",
                "proprio come quando ti sposti di un metro sulla panchina per",
                "proprio come quel profumo di pane fresco alle sei di mattina che",
                "e pazienza se il semaforo resta rosso: la vera rivoluzione è",
                "perché abbracciarsi forte non costa nulla, ma è",
                "e allora ti tornano in mente i consigli di tua nonna quando diceva che",
                "e scopri che ogni cicatrice è solo un francobollo per",
                "perché rincorrere i sogni senza scarpe comode ti costringe a",
                "e capisci che il barbone all'angolo aveva ragione quando ti suggeriva di",
                "proprio come una vecchia canzone di De Gregori che ti spinge a",
                "e poco importa se hai dimenticato l'ombrello a casa: l'essenziale è",
                "perché stringere un volante nel traffico è solo un pretesto per",
                "e allora ti rendi conto che la felicità non fa rumore, vuole solo"
            ],
            D: [
                "lasciare la porta socchiusa all'inaspettato, prima che raffreddi la brioche.",
                "far respirare la propria essenza e ricominciare a camminare a piedi nudi.",
                "accettare che non tutte le risposte hanno bisogno di una domanda per fare male.",
                "l'unico modo per fare pace con la propria teleologia senza perdere il tram.",
                "ritrovare quel sapore di buono che credevi sparito sotto il pavimento.",
                "fare un bel respiro, ordinare un altro cornetto e perdonarsi di esistere.",
                "illuminare i dettagli invisibili che solo chi ha sofferto sa riconoscere.",
                "lasciarsi sorprendere dalla vita, anche quando ha il sapore di un lunedì.",
                "mordere la vita prima che sia la vita a chiedere il conto al tavolo.",
                "ascoltare la propria pancia e regalarsi finalmente un giorno di pioggia.",
                "scrivere la parola 'fine' con la consapevolezza che era solo l'incipit.",
                "bere tutto d'un fiato il proprio destino senza chiedere il resto.",
                "rimettere a posto i pezzi del cuore senza usare le istruzioni dell'IKEA.",
                "guardare fuori dal finestrino e sorridere a chi non ci sta guardando.",
                "accendere la musica al massimo e dimenticarsi dove si stava andando."
            ]
        };

        let currentText = "";

        function generateQuote() {
            const a = database.A[Math.floor(Math.random() * database.A.length)];
            const b = database.B[Math.floor(Math.random() * database.B.length)];
            const c = database.C[Math.floor(Math.random() * database.C.length)];
            const d = database.D[Math.floor(Math.random() * database.D.length)];

            currentText = `${a} ${b} ${c} ${d}`;
            document.getElementById('quoteOutput').textContent = `"${currentText}"`;
        }

        function shareQuote() {
            if (navigator.share) {
                navigator.share({
                    title: 'Pensiero Motivazionale',
                    text: `"${currentText}"`
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(`"${currentText}"`).then(() => {
                    showToast();
                });
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        window.onload = generateQuote;
    </script>
</body>
</html>
